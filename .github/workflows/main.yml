
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract source code
        run: |
          unzip -q MHRPortTool_source.zip -d source
          ls -la source

      - name: Build debug APK
        run: |
          F=$(find source -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          echo "Found: $F"
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MHRPortTool-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
